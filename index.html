<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Simple Weather</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <h1 class="title" id="title">Hello.</h1>

    <div class="container">
      <form class="searchBar" id="searchBar">
        <input
          id="citySearch"
          class="input"
          type="text"
          placeholder="City"
          aria-label="City"
        />
        <div
          class="searchIcon"
          id="searchIcon"
          role="button"
          tabindex="0"
          aria-label="Search city"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16" y1="16" x2="22" y2="22"></line>
          </svg>
        </div>
      </form>

      <div class="card">
        <h3>at <span id="time">--:--</span></h3>
        <h2 id="temperature">--°C</h2>
      </div>
    </div>

    <script src="./src/script.js"></script>
  </body>
</html>
